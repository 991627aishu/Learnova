version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - proxy-net
    logging: *default-logging
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - proxy-net
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://overleaf:password@postgres:5432/overleaf_clone
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecret123
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - LATEX_CONTAINER_NAME=latex_engine
    depends_on:
      - postgres
      - redis
      - latex_engine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./latex-temp:/latex-temp
    networks:
      - proxy-net
      - backend-net
    logging: *default-logging
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://overleaf:password@postgres:5432/overleaf_clone
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend-net
    depends_on:
      - redis
      - postgres
    logging: *default-logging
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=overleaf
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=overleaf_clone
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-net
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    restart: always

  minio:
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend-net
    restart: always

  latex_engine:
    image: blang/latex:ctanbasic
    container_name: latex_engine
    volumes:
      - ./latex-temp:/data
    working_dir: /data
    command: tail -f /dev/null
    networks:
      - backend-net
    restart: always

networks:
  proxy-net:
  backend-net:

volumes:
  pg_data:
  redis_data:
  minio_data:
